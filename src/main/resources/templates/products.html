<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{template1}">
<head>
    <title>Liste des produits</title>
</head>
<body>
<div layout:fragment="content1">
    <div class="card">
        <div class="card-header">Liste des produits</div>
        <div class="card-body">

            <form method="get" th:action="@{/user/index}" class="row g-2 mb-3">
                <div class="col-auto">
                    <input type="text" name="keyword" class="form-control"
                           placeholder="Rechercher un produit..." th:value="${keyword}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Rechercher
                    </button>
                    <a th:href="@{/user/index}" class="btn btn-outline-secondary">Réinitialiser</a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prix</th>
                        <th>Quantité</th>
                        <th sec:authorize="hasRole('ADMIN')">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${productList}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.price}"></td>
                        <td th:text="${p.quantity}"></td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a class="btn btn-warning btn-sm"
                               th:href="@{/admin/editProduct(id=${p.id})}">
                                <i class="bi bi-pencil"></i> Modifier
                            </a>
                            <a class="btn btn-danger btn-sm"
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce produit ?')"
                               th:href="@{/admin/delete(id=${p.id}, keyword=${keyword}, page=${currentPage})}">
                                <i class="bi bi-trash"></i> Supprimer
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productList)}">
                        <td colspan="5" class="text-center">Aucun produit trouvé.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <ul class="nav nav-pills" th:if="${pages.length > 1}">
                <li th:each="p, status : ${pages}">
                    <a th:href="@{/user/index(page=${status.index}, keyword=${keyword})}"
                       th:text="${status.index + 1}"
                       th:class="${status.index == currentPage} ? 'btn btn-primary ms-1' : 'btn btn-outline-primary ms-1'">
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
